# Gazetteer du pack imagerie_medicale : attribut -> valeur du catalogue -> formes orales.
#
# Écrit À LA MAIN (pas généré depuis build_phrases.py) : comment un patient nomme l'examen
# au téléphone. La valeur elle-même (« genou », « IRM »...) est toujours reconnue, inutile de
# la répéter ici. Le résolveur normalise tout (minuscules, sans accents) et cherche les formes
# longues d'abord : « veines des jambes » l'emporte sur « jambes ».
#
# Attention à l'évaluation : l'auteur de ce fichier a vu les phrases générées. Le score sur
# ces phrases est donc optimiste ; les chiffres qui comptent sont ceux du jeu « aveugle »
# (data/phrases_aveugles/) et des vraies transcriptions Whisper.

